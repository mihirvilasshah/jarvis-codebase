<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Northwind Knowledge Galaxy</title>
  <meta name="description" content="A 3D knowledge galaxy built from Northwind Roasters' notes, with an assistant that answers only from those notes." />
  <meta name="theme-color" content="#04060a" />
  <style>
    :root {
      --bg: #04060a;
      --ink: #e8f2ff;
      --muted: #8ea3bd;
      --line: rgba(148, 184, 224, 0.16);
      --glass: rgba(8, 15, 27, 0.72);
      --cyan: #67e8f9;
      --violet: #a78bfa;
      --gold: #fbbf24;
      --rose: #f472b6;
      --mint: #5eead4;
      --lime: #a3e635;
      --font: "Segoe UI", "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", "Consolas", monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    ::selection { background: rgba(103, 232, 249, 0.28); }

    #space {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 18% 12%, rgba(56, 189, 248, 0.10), transparent 62%),
        radial-gradient(ellipse 48% 42% at 84% 78%, rgba(167, 139, 250, 0.12), transparent 65%),
        radial-gradient(ellipse 40% 35% at 62% 24%, rgba(244, 114, 182, 0.06), transparent 70%),
        #04060a;
      z-index: 0;
    }
    #graph { position: fixed; inset: 0; z-index: 1; }
    #graph canvas { display: block; }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(1, 3, 7, 0.62) 100%);
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E");
    }

    .hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 28px;
      pointer-events: none;
    }
    .hud > * { pointer-events: auto; }
    .brand { display: flex; align-items: flex-start; gap: 14px; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #061018;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow: 0 0 28px rgba(103, 232, 249, 0.55);
      font-size: 18px;
      flex: 0 0 auto;
      margin-top: 2px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 3.1vw, 38px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: -0.03em;
    }
    h1 em {
      font-style: normal;
      font-weight: 650;
      background: linear-gradient(100deg, #f8fdff 5%, var(--cyan) 48%, var(--violet) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .stats {
      margin: 9px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
    }
    .stats span { color: #cfe6ff; }

    .ghost-btn {
      border: 1px solid var(--line);
      background: rgba(7, 14, 25, 0.55);
      color: #c5d8ee;
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12px;
      letter-spacing: 0.02em;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
    }
    .ghost-btn:hover { border-color: rgba(103, 232, 249, 0.55); color: #fff; background: rgba(14, 27, 45, 0.8); }

    .legend {
      position: fixed;
      left: 28px;
      bottom: 132px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(6, 12, 22, 0.58);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
    }
    .legend-title {
      margin: 0 0 4px 6px;
      color: #7089a6;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 154px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      padding: 6px 7px;
      color: #a9bed6;
      font-size: 11.5px;
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .legend-item:hover, .legend-item.active { background: rgba(148, 184, 224, 0.09); color: #fff; }
    .legend-item .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 10px var(--c);
      flex: 0 0 auto;
    }
    .legend-item .count { margin-left: auto; color: #5f7894; font-family: var(--mono); font-size: 9.5px; }

    .panel {
      position: fixed;
      top: 98px;
      right: 24px;
      bottom: 126px;
      z-index: 12;
      width: min(390px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      padding: 20px 22px;
      border: 1px solid rgba(148, 184, 224, 0.2);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(12, 22, 38, 0.9), rgba(5, 10, 19, 0.9));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(22px);
      transform: translateX(calc(100% + 48px));
      opacity: 0;
      transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1), opacity 300ms ease;
      overflow: auto;
    }
    .panel.open { transform: translateX(0); opacity: 1; }
    .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(148, 184, 224, 0.2);
      border-radius: 999px;
      padding: 5px 10px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: #a9bed6;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
    }
    .icon-btn:hover { color: #fff; border-color: rgba(103, 232, 249, 0.5); }
    .panel h2 { margin: 0 0 14px; font-size: 27px; font-weight: 550; line-height: 1.12; letter-spacing: -0.025em; }
    .panel-excerpt { margin: 0; color: #b6c8dc; font-size: 13.5px; line-height: 1.72; }
    .panel-links { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
    .panel-label {
      margin: 0 0 10px;
      color: #7089a6;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .link-list { display: flex; flex-direction: column; gap: 6px; }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 9px;
      background: rgba(148, 184, 224, 0.05);
      padding: 8px 10px;
      color: #c3d6ea;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .link-btn:hover { border-color: rgba(103, 232, 249, 0.32); background: rgba(103, 232, 249, 0.08); color: #fff; }
    .link-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: 0 0 auto; }
    .muted-note { margin: 0; color: #647d98; font-size: 12px; line-height: 1.5; }
    .ask-btn {
      margin-top: auto;
      padding-top: 20px;
      border: 0;
      background: transparent;
      color: var(--cyan);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      letter-spacing: 0.01em;
    }
    .ask-btn:hover { color: #fff; }

    .chat {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 15;
      width: min(760px, calc(100vw - 32px));
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .chat > * { pointer-events: auto; }
    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: min(42vh, 380px);
      overflow-y: auto;
      padding: 4px 4px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(103, 232, 249, 0.3) transparent;
    }
    .chat-log:empty { display: none; }
    .message {
      max-width: 88%;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 10px 13px;
      background: rgba(7, 14, 25, 0.84);
      backdrop-filter: blur(18px);
      font-size: 12.5px;
      line-height: 1.55;
      color: #cfe0f2;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      animation: rise 220ms ease both;
    }
    .message.user { align-self: flex-end; border-color: rgba(103, 232, 249, 0.26); background: rgba(16, 42, 56, 0.72); color: #e8fbff; }
    .message.assistant { align-self: flex-start; }
    .message.error { border-color: rgba(251, 113, 133, 0.4); color: #ffd9df; background: rgba(52, 12, 22, 0.72); }
    .message p { margin: 0; }
    .message .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(148, 184, 224, 0.13); }
    .message .sources span { color: #6f89a6; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; margin-right: 2px; }
    .source-chip {
      border: 1px solid rgba(103, 232, 249, 0.24);
      border-radius: 999px;
      background: rgba(103, 232, 249, 0.07);
      padding: 3px 8px;
      color: #9fe9f5;
      font-size: 10px;
      cursor: pointer;
    }
    .source-chip:hover { background: rgba(103, 232, 249, 0.16); color: #fff; }
    .typing { display: inline-flex; gap: 4px; align-items: center; height: 14px; }
    .typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); animation: blink 1.1s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }

    .chat-form { width: 100%; }
    .chat-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 16px;
      border: 1px solid rgba(148, 184, 224, 0.22);
      border-radius: 999px;
      background: rgba(7, 14, 25, 0.82);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    .chat-input-wrap:focus-within {
      border-color: rgba(103, 232, 249, 0.55);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42), 0 0 0 4px rgba(103, 232, 249, 0.08);
    }
    .spark { color: var(--cyan); font-size: 15px; text-shadow: 0 0 14px rgba(103, 232, 249, 0.8); flex: 0 0 auto; }
    #chat-input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #e8f2ff;
      font-size: 13px;
      padding: 8px 0;
    }
    #chat-input::placeholder { color: #6d86a2; }
    #chat-send {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: #041018;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(103, 232, 249, 0.35);
      transition: transform 160ms ease, filter 160ms ease;
    }
    #chat-send:hover { transform: scale(1.06); filter: brightness(1.08); }
    #chat-send:disabled { opacity: 0.45; cursor: wait; transform: none; }
    #chat-send svg { width: 16px; height: 16px; }
    .chat-hint {
      margin: 7px 0 0;
      color: #627b96;
      font-size: 9.5px;
      text-align: center;
      font-family: var(--mono);
      letter-spacing: 0.03em;
    }
    .chat-hint .status { color: var(--cyan); }
    .chat-hint .status.error { color: #fb7185; }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: #04060a;
      transition: opacity 700ms ease, visibility 700ms ease;
    }
    .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-orbit {
      width: 62px;
      height: 62px;
      border: 1px solid rgba(103, 232, 249, 0.25);
      border-radius: 50%;
      position: relative;
      animation: spin 4s linear infinite;
    }
    .loader-orbit::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(167, 139, 250, 0.22);
      border-radius: 50%;
    }
    .loader-orbit span {
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan);
    }
    .loader p { margin: 0; color: #cfe6ff; font-size: 13px; letter-spacing: 0.02em; }
    .loader small { color: #5f7894; font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }
    .loader .fatal { max-width: 420px; padding: 0 24px; text-align: center; color: #ffd9df; font-size: 13px; line-height: 1.6; }

    .toast {
      position: fixed;
      top: 22px;
      left: 50%;
      z-index: 60;
      transform: translate(-50%, -16px);
      max-width: min(520px, calc(100vw - 32px));
      border: 1px solid rgba(251, 113, 133, 0.35);
      border-radius: 12px;
      background: rgba(45, 10, 20, 0.92);
      padding: 10px 14px;
      color: #ffd9df;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      backdrop-filter: blur(16px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .scene-tooltip { color: #e8f2ff; font-family: var(--font); font-size: 12px; }
    .tip { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid rgba(148, 184, 224, 0.22); border-radius: 10px; background: rgba(5, 11, 20, 0.9); backdrop-filter: blur(10px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
    .tip small { display: block; margin-left: 2px; color: #7891ad; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

    @media (max-width: 760px) {
      .hud { padding: 16px; }
      .brand-mark { width: 32px; height: 32px; font-size: 15px; }
      .eyebrow { font-size: 8.5px; }
      h1 { font-size: 25px; }
      .stats { font-size: 9px; }
      .ghost-btn { padding: 8px 12px; font-size: 11px; }
      .legend {
        left: 12px;
        right: 12px;
        bottom: 102px;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 2px;
        padding: 8px;
        border-radius: 14px;
      }
      .legend-title { display: none; }
      .legend-item { min-width: 0; padding: 5px 7px; font-size: 10px; }
      .legend-item .count { display: none; }
      .panel {
        top: auto;
        left: 10px;
        right: 10px;
        bottom: 96px;
        width: auto;
        max-height: 54vh;
        padding: 18px;
        border-radius: 20px;
        transform: translateY(calc(100% + 120px));
      }
      .panel.open { transform: translateY(0); }
      .panel h2 { font-size: 23px; }
      .chat { bottom: 10px; width: calc(100vw - 20px); }
      .chat-log { max-height: 34vh; }
      .message { max-width: 94%; }
      .chat-hint { font-size: 8.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="space" aria-hidden="true"></div>
  <div id="graph" role="img" aria-label="3D graph of Northwind Roasters notes"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="hud">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <div>
        <p class="eyebrow">Northwind Roasters</p>
        <h1>Knowledge <em>Galaxy</em></h1>
        <p class="stats"><span id="stat-notes">—</span> notes · <span id="stat-links">—</span> connections · <span id="stat-groups">—</span> clusters</p>
      </div>
    </div>
    <button id="reset-view" class="ghost-btn" type="button">Reset view</button>
  </header>

  <nav id="legend" class="legend" aria-label="Filter notes by group">
    <p class="legend-title">Clusters</p>
  </nav>

  <aside id="panel" class="panel" aria-hidden="true" aria-label="Note details">
    <div class="panel-top">
      <span id="panel-group" class="badge"></span>
      <button id="panel-close" class="icon-btn" type="button" aria-label="Close note details">×</button>
    </div>
    <h2 id="panel-title"></h2>
    <p id="panel-excerpt" class="panel-excerpt"></p>
    <div class="panel-links">
      <p class="panel-label">Connected notes</p>
      <div id="panel-links" class="link-list"></div>
    </div>
    <button id="panel-ask" class="ask-btn" type="button">Ask about this note →</button>
  </aside>

  <section class="chat" aria-label="Ask your notes">
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <div class="chat-input-wrap">
        <span class="spark" aria-hidden="true">✦</span>
        <input id="chat-input" type="text" maxlength="2000" placeholder="Ask your knowledge galaxy…" aria-label="Ask a question about your notes" />
        <button id="chat-send" type="submit" aria-label="Send question">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </div>
      <p class="chat-hint">Answers use only your notes. <span id="chat-status" class="status"></span></p>
    </form>
  </section>

  <div id="loader" class="loader">
    <div class="loader-orbit" aria-hidden="true"><span></span></div>
    <p>Mapping your notes into orbit…</p>
    <small>Loading the 3D engine</small>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./graph-data.js"></script>
  <script>
    window.__kgErrors = [];
    window.addEventListener('error', function (event) {
      window.__kgErrors.push((event.message || 'error') + ' @ ' + (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0));
    });
    window.addEventListener('unhandledrejection', function (event) {
      window.__kgErrors.push('rejection: ' + String(event.reason));
    });
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/+esm"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import ForceGraph3D from 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.2/+esm';

    const DATA = window.GRAPH;

    const $ = (id) => document.getElementById(id);
    const loader = $('loader');
    const graphEl = $('graph');
    const panel = $('panel');
    const panelGroup = $('panel-group');
    const panelTitle = $('panel-title');
    const panelExcerpt = $('panel-excerpt');
    const panelLinks = $('panel-links');
    const chatLog = $('chat-log');
    const chatForm = $('chat-form');
    const chatInput = $('chat-input');
    const chatSend = $('chat-send');
    const chatStatus = $('chat-status');
    const toastEl = $('toast');
    const legendEl = $('legend');

    const GROUP_COLORS = {
      Company: '#67e8f9',
      Finance: '#fbbf24',
      Marketing: '#f472b6',
      Operations: '#5eead4',
      People: '#a78bfa',
      Product: '#a3e635'
    };
    const FALLBACK_COLORS = ['#67e8f9', '#fbbf24', '#f472b6', '#5eead4', '#a78bfa', '#a3e635', '#fb7185', '#93c5fd'];

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function showFatal(message) {
      loader.classList.remove('hidden');
      loader.innerHTML = '<div class="fatal">' + escapeHtml(message) + '</div>';
    }

    let toastTimer = 0;
    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toastEl.classList.remove('show'), 4200);
    }

    if (!DATA || !Array.isArray(DATA.nodes) || !DATA.nodes.length) {
      showFatal('Graph data is missing. Run `python build.py` and reload this page.');
      throw new Error('Graph data is missing');
    }

    const nodes = DATA.nodes;
    const links = Array.isArray(DATA.links) ? DATA.links : [];
    const groups = [...new Set(nodes.map((node) => node.group))].sort((a, b) => a.localeCompare(b));

    function groupColor(group) {
      if (GROUP_COLORS[group]) return GROUP_COLORS[group];
      const index = Math.max(0, groups.indexOf(group));
      return FALLBACK_COLORS[index % FALLBACK_COLORS.length];
    }

    function idOf(endpoint) {
      return typeof endpoint === 'object' && endpoint !== null ? endpoint.id : endpoint;
    }

    const degree = new Map(nodes.map((node) => [node.id, 0]));
    const adjacency = new Map(nodes.map((node) => [node.id, new Set()]));
    for (const link of links) {
      const source = idOf(link.source);
      const target = idOf(link.target);
      degree.set(source, (degree.get(source) || 0) + 1);
      degree.set(target, (degree.get(target) || 0) + 1);
      if (adjacency.has(source)) adjacency.get(source).add(target);
      if (adjacency.has(target)) adjacency.get(target).add(source);
    }

    $('stat-notes').textContent = String(nodes.length);
    $('stat-links').textContent = String(links.length);
    $('stat-groups').textContent = String(groups.length);

    for (const group of groups) {
      const count = nodes.filter((node) => node.group === group).length;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'legend-item';
      button.dataset.group = group;
      button.innerHTML =
        '<span class="dot" style="--c:' + groupColor(group) + '"></span>' +
        '<span>' + escapeHtml(group) + '</span>' +
        '<span class="count">' + count + '</span>';
      button.addEventListener('click', () => toggleGroup(group));
      legendEl.appendChild(button);
    }

    let graph;
    let selectedId = null;
    let hoveredId = null;
    let cited = new Set();
    let focusedGroup = null;

    function makeGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.18, 'rgba(255,255,255,0.72)');
      gradient.addColorStop(0.45, 'rgba(255,255,255,0.22)');
      gradient.addColorStop(0.72, 'rgba(255,255,255,0.055)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function makeNebulaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(128, 128, 0, 128, 128, 128);
      gradient.addColorStop(0, 'rgba(255,255,255,0.8)');
      gradient.addColorStop(0.3, 'rgba(255,255,255,0.28)');
      gradient.addColorStop(0.65, 'rgba(255,255,255,0.07)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 256, 256);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const glowTexture = makeGlowTexture();
    const nebulaTexture = makeNebulaTexture();

    function makeNodeObject(node) {
      const color = new THREE.Color(groupColor(node.group));
      const radius = 2.05 + Math.min(degree.get(node.id) || 0, 10) * 0.33;
      const group = new THREE.Group();

      const glow = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: glowTexture,
          color,
          transparent: true,
          opacity: 0.82,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: true
        })
      );
      glow.scale.setScalar(radius * 7.2);

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 22, 22),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
      );

      group.add(glow, core);
      node.__obj = group;
      node.__core = core;
      node.__glow = glow;
      node.__color = color;
      node.__radius = radius;
      return group;
    }

    graph = ForceGraph3D({ controlType: 'orbit' })(graphEl)
      .graphData(DATA)
      .backgroundColor('#04060a')
      .showNavInfo(false)
      .nodeRelSize(4)
      .nodeVal((node) => 1 + Math.min(degree.get(node.id) || 0, 10) * 0.35)
      .nodeThreeObject(makeNodeObject)
      .nodeLabel(
        (node) =>
          '<div class="tip"><span style="color:' + groupColor(node.group) + '">●</span>' +
          escapeHtml(node.label) +
          '<small>' + escapeHtml(node.group) + '</small></div>'
      )
      .linkColor(linkColorAccessor)
      .linkWidth(linkWidthAccessor)
      .linkOpacity(0.42)
      .linkDirectionalParticles(particleAccessor)
      .linkDirectionalParticleWidth(1.15)
      .linkDirectionalParticleSpeed(0.0035)
      .linkDirectionalParticleColor(() => '#bff7ff')
      .onNodeClick((node) => selectNode(node.id, true))
      .onNodeHover((node) => {
        hoveredId = node ? node.id : null;
        graphEl.style.cursor = node ? 'pointer' : 'grab';
      })
      .onBackgroundClick(() => closePanel())
      .cooldownTicks(240)
      .cooldownTime(3500)
      .warmupTicks(50);

    graph.d3Force('charge').strength(-185).distanceMax(760);
    graph.d3Force('link').distance((link) => 46 + 4 * Math.min(degree.get(idOf(link.source)) || 0, 7)).strength(0.55);
    graph.d3Force('center').strength(0.78);

    const scene = graph.scene();
    scene.background = new THREE.Color('#04060a');

    if (new URLSearchParams(location.search).has('debug')) {
      window.__kgGraph = graph;
    }

    function makeStarLayer(count, minRadius, maxRadius, size, color, opacity) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      for (let index = 0; index < count; index += 1) {
        const radius = minRadius + Math.random() * (maxRadius - minRadius);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[index * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[index * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[index * 3 + 2] = radius * Math.cos(phi);
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color,
        size,
        transparent: true,
        opacity,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false
      });
      return new THREE.Points(geometry, material);
    }

    const starLayerA = makeStarLayer(1500, 520, 1500, 1.1, '#dbeafe', 0.85);
    const starLayerB = makeStarLayer(420, 620, 1300, 2.2, '#a5b4fc', 0.5);
    scene.add(starLayerA, starLayerB);

    const nebulae = [
      { position: [-620, 280, -820], color: '#1d4ed8', scale: 1050, opacity: 0.10 },
      { position: [740, -260, -620], color: '#7c3aed', scale: 900, opacity: 0.11 },
      { position: [120, 520, -980], color: '#0e7490', scale: 760, opacity: 0.08 }
    ];
    for (const item of nebulae) {
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: nebulaTexture,
          color: item.color,
          transparent: true,
          opacity: item.opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          fog: false
        })
      );
      sprite.position.set(...item.position);
      sprite.scale.setScalar(item.scale);
      scene.add(sprite);
    }

    const clock = new THREE.Clock();
    function animate() {
      window.requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      starLayerA.rotation.y = time * 0.007;
      starLayerB.rotation.y = -time * 0.011;
      starLayerA.material.opacity = 0.74 + Math.sin(time * 0.7) * 0.12;
      starLayerB.material.opacity = 0.42 + Math.sin(time * 0.45 + 1.2) * 0.1;

      for (const node of nodes) {
        if (!node.__obj) continue;
        let target = 1;
        if (node.id === selectedId) target = 1.17 + Math.sin(time * 2.5) * 0.055;
        else if (cited.has(node.id)) target = 1.11 + Math.sin(time * 1.9 + node.id) * 0.04;
        else if (node.id === hoveredId) target = 1.1;
        const next = node.__obj.scale.x + (target - node.__obj.scale.x) * 0.12;
        node.__obj.scale.setScalar(next);
      }
    }
    animate();

    window.addEventListener('resize', () => {
      graph.width(window.innerWidth).height(window.innerHeight);
    });

    function activeSet() {
      if (selectedId !== null) {
        const active = new Set([selectedId]);
        for (const neighbour of adjacency.get(selectedId) || []) active.add(neighbour);
        return active;
      }
      if (focusedGroup) {
        return new Set(nodes.filter((node) => node.group === focusedGroup).map((node) => node.id));
      }
      if (cited.size) return new Set(cited);
      return null;
    }

    function linkIsActive(link) {
      const source = idOf(link.source);
      const target = idOf(link.target);
      const active = activeSet();
      if (!active) return true;
      if (selectedId !== null) return source === selectedId || target === selectedId;
      if (focusedGroup) return active.has(source) && active.has(target);
      return active.has(source) || active.has(target);
    }

    function linkColorAccessor(link) {
      return linkIsActive(link) ? 'rgba(125, 211, 252, 0.52)' : 'rgba(71, 85, 105, 0.10)';
    }

    function linkWidthAccessor(link) {
      return linkIsActive(link) ? 1.05 : 0.3;
    }

    function particleAccessor(link) {
      return linkIsActive(link) ? 1 : 0;
    }

    function setNodeDim(node, dim) {
      if (!node.__core || !node.__glow) return;
      if (dim) {
        node.__core.material.color.copy(node.__color).multiplyScalar(0.2);
        node.__core.material.opacity = 0.38;
        node.__glow.material.opacity = 0.015;
      } else {
        node.__core.material.color.copy(node.__color);
        node.__core.material.opacity = 1;
        node.__glow.material.opacity = 0.78;
      }
    }

    function applyFocus() {
      const active = activeSet();
      for (const node of nodes) setNodeDim(node, active ? !active.has(node.id) : false);
      if (selectedId !== null && nodes[selectedId] && nodes[selectedId].__glow) {
        nodes[selectedId].__glow.material.opacity = 1;
      }
      for (const id of cited) {
        if (nodes[id] && nodes[id].__glow) nodes[id].__glow.material.opacity = 0.98;
      }
      graph.linkColor(linkColorAccessor);
      graph.linkWidth(linkWidthAccessor);
      graph.linkDirectionalParticles(particleAccessor);
    }

    function updateLegendActive() {
      for (const item of legendEl.querySelectorAll('.legend-item')) {
        item.classList.toggle('active', item.dataset.group === focusedGroup);
      }
    }

    function flyTo(node) {
      const nodePosition = new THREE.Vector3(node.x || 0, node.y || 0, node.z || 0);
      const camera = graph.cameraPosition();
      const direction = new THREE.Vector3(
        (camera.x || 0) - nodePosition.x,
        (camera.y || 0) - nodePosition.y,
        (camera.z || 0) - nodePosition.z
      );
      if (direction.lengthSq() < 1) direction.set(0, 0, 1);
      direction.normalize().multiplyScalar(82);
      const target = nodePosition.clone().add(direction);
      graph.cameraPosition(
        { x: target.x, y: target.y, z: target.z },
        { x: nodePosition.x, y: nodePosition.y, z: nodePosition.z },
        1300
      );
    }

    function openPanel(node) {
      const color = groupColor(node.group);
      panelGroup.textContent = node.group;
      panelGroup.style.color = color;
      panelGroup.style.borderColor = color + '55';
      panelGroup.style.background = color + '18';
      panelTitle.textContent = node.label;
      panelExcerpt.textContent = node.excerpt;
      panelLinks.replaceChildren();

      const neighbours = [...(adjacency.get(node.id) || [])]
        .map((id) => nodes[id])
        .filter(Boolean)
        .sort((a, b) => a.label.localeCompare(b.label));

      if (!neighbours.length) {
        const empty = document.createElement('p');
        empty.className = 'muted-note';
        empty.textContent = 'No direct connections yet.';
        panelLinks.appendChild(empty);
      } else {
        for (const neighbour of neighbours) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'link-btn';
          const dot = document.createElement('span');
          dot.className = 'dot';
          dot.style.setProperty('--c', groupColor(neighbour.group));
          const label = document.createElement('span');
          label.textContent = neighbour.label;
          button.append(dot, label);
          button.addEventListener('click', () => selectNode(neighbour.id, true));
          panelLinks.appendChild(button);
        }
      }

      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
    }

    function closePanel() {
      selectedId = null;
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      applyFocus();
      if (graph) graph.controls().autoRotate = !focusedGroup;
    }

    function selectNode(id, fly) {
      const node = nodes[id];
      if (!node) return;
      selectedId = id;
      focusedGroup = null;
      updateLegendActive();
      openPanel(node);
      applyFocus();
      if (fly) flyTo(node);
      graph.controls().autoRotate = false;
    }

    function toggleGroup(group) {
      selectedId = null;
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      focusedGroup = focusedGroup === group ? null : group;
      cited.clear();
      updateLegendActive();
      applyFocus();
      graph.controls().autoRotate = !focusedGroup;

      if (focusedGroup) {
        const members = nodes.filter((node) => node.group === group && Number.isFinite(node.x));
        if (members.length) {
          const centre = members.reduce(
            (acc, node) => ({ x: acc.x + node.x, y: acc.y + node.y, z: acc.z + node.z }),
            { x: 0, y: 0, z: 0 }
          );
          centre.x /= members.length;
          centre.y /= members.length;
          centre.z /= members.length;
          graph.cameraPosition(
            { x: centre.x + 165, y: centre.y + 95, z: centre.z + 235 },
            { x: centre.x, y: centre.y, z: centre.z },
            1200
          );
        }
      } else {
        graph.cameraPosition({ x: 0, y: 45, z: 480 }, { x: 0, y: 0, z: 0 }, 1200);
      }
    }

    function resetView() {
      selectedId = null;
      focusedGroup = null;
      cited.clear();
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      updateLegendActive();
      applyFocus();
      graph.cameraPosition({ x: 0, y: 45, z: 480 }, { x: 0, y: 0, z: 0 }, 1200);
      graph.controls().autoRotate = true;
    }

    $('panel-close').addEventListener('click', closePanel);
    $('reset-view').addEventListener('click', resetView);
    $('panel-ask').addEventListener('click', () => {
      if (selectedId === null) return;
      chatInput.value = 'What should I know about ' + nodes[selectedId].label + '?';
      chatInput.focus();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closePanel();
    });

    graph.cameraPosition({ x: 0, y: 45, z: 500 });
    graph.controls().autoRotate = true;
    graph.controls().autoRotateSpeed = 0.38;
    graph.controls().enableDamping = true;
    graph.controls().dampingFactor = 0.08;
    graph.controls().minDistance = 35;
    graph.controls().maxDistance = 1800;

    window.__kgReady = true;
    loader.classList.add('hidden');
    loader.style.display = 'none';

    let booted = false;
    function finishBoot() {
      if (booted) return;
      booted = true;
      window.__kgReady = true;
      try {
        graph.zoomToFit(1000, 80);
      } catch {
        /* the graph may not be ready to fit yet */
      }
      loader.classList.add('hidden');
      loader.style.display = 'none';
      graph.controls().autoRotate = true;
    }

    graph.onEngineStop(finishBoot);
    window.setTimeout(finishBoot, 2600);

    const isLocal4700 =
      (location.hostname === '127.0.0.1' || location.hostname === 'localhost') && location.port === '4700';
    const CHAT_ENDPOINT = window.KG_CHAT_ENDPOINT || (isLocal4700 ? '/chat' : '/api/chat');

    let sessionId = '';
    try {
      sessionId = localStorage.getItem('kg_session_id') || '';
      if (!sessionId) {
        sessionId =
          typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID()
            : 's_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('kg_session_id', sessionId);
      }
    } catch {
      sessionId = 's_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    let history = [];
    try {
      const stored = sessionStorage.getItem('kg_history');
      const parsed = stored ? JSON.parse(stored) : [];
      if (Array.isArray(parsed)) {
        history = parsed
          .filter((item) => item && (item.role === 'user' || item.role === 'assistant') && typeof item.content === 'string')
          .slice(-6);
      }
    } catch {
      history = [];
    }

    function saveHistory() {
      history = history.slice(-6);
      try {
        sessionStorage.setItem('kg_history', JSON.stringify(history));
      } catch {
        /* storage may be unavailable in private mode */
      }
    }

    function scrollChat() {
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addMessage(role, text, sourceIds = [], animate = true) {
      const message = document.createElement('div');
      message.className = 'message ' + role;
      if (!animate) message.style.animation = 'none';
      const paragraph = document.createElement('p');
      paragraph.textContent = text;
      message.appendChild(paragraph);

      const ids = sourceIds.filter((id) => Number.isInteger(id) && nodes[id]);
      if (ids.length) {
        const sources = document.createElement('div');
        sources.className = 'sources';
        const label = document.createElement('span');
        label.textContent = 'Sources';
        sources.appendChild(label);
        for (const id of ids) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'source-chip';
          chip.textContent = nodes[id].label;
          chip.addEventListener('click', () => selectNode(id, true));
          sources.appendChild(chip);
        }
        message.appendChild(sources);
      }

      chatLog.appendChild(message);
      scrollChat();
      return message;
    }

    function addTyping() {
      const message = document.createElement('div');
      message.className = 'message assistant';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<i></i><i></i><i></i>';
      message.appendChild(typing);
      chatLog.appendChild(message);
      scrollChat();
      return message;
    }

    function setBusy(busy) {
      chatSend.disabled = busy;
      chatInput.disabled = busy;
      chatStatus.textContent = busy ? 'thinking…' : '';
      chatStatus.classList.toggle('error', false);
    }

    async function ask(question) {
      const text = String(question || '').trim();
      if (!text || chatSend.disabled) return;

      const priorHistory = history.slice(-6);
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      saveHistory();
      setBusy(true);
      const typing = addTyping();

      try {
        const response = await fetch(CHAT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text, session_id: sessionId, history: priorHistory })
        });
        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error('The server returned an unreadable response.');
        }
        if (!response.ok) {
          throw new Error(data.error || 'The knowledge assistant could not answer that.');
        }
        const answer = typeof data.answer === 'string' ? data.answer.trim() : '';
        if (!answer) throw new Error('The knowledge assistant returned an empty answer.');
        const ids = Array.isArray(data.nodes)
          ? data.nodes.filter((id) => Number.isInteger(id) && nodes[id])
          : [];

        typing.remove();
        addMessage('assistant', answer, ids);
        history.push({ role: 'assistant', content: answer });
        saveHistory();
        cited = new Set(ids);
        applyFocus();
        if (ids.length === 0) {
          toast('No notes matched that question. Try a different topic.');
        }
      } catch (error) {
        typing.remove();
        if (history.length && history[history.length - 1].role === 'user') history.pop();
        saveHistory();
        const message = error && error.message ? error.message : 'Something went wrong. Please try again.';
        addMessage('error', message);
        toast(message);
      } finally {
        setBusy(false);
        chatInput.focus();
      }
    }

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const question = chatInput.value;
      chatInput.value = '';
      ask(question);
    });

    if (location.protocol === 'file:') {
      chatInput.disabled = true;
      chatSend.disabled = true;
      chatStatus.textContent = 'run python server.py to chat';
      chatStatus.classList.add('error');
    }

    for (const item of history) addMessage(item.role, item.content, [], false);

    window.__kgModuleDone = true;

  </script>
  <script>
    window.setTimeout(function () {
      if (!window.__kgReady) {
        var loader = document.getElementById('loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.innerHTML = '<div class="fatal">The 3D engine did not load. Check your internet connection and reload, or run <code>python server.py</code> locally.</div>';
        }
      }
    }, 15000);
  </script>
</body>
</html>
